<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Bon de dépôt envoyé - Reset Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            background-image: url('/images/noise.png');
            background-repeat: repeat;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(45, 45, 45, 0.85);
            padding: 48px 32px;
            border-radius: 12px;
            border: 1px solid #404040;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .checkmark {
            width: 72px; height: 72px; border-radius: 50%;
            background: #10b981; color: #fff; font-size: 40px; line-height: 72px;
            margin: 0 auto 24px;
        }
        h1 { font-size: 2rem; color: #fff; margin-bottom: 16px; }
        p { font-size: 1.05rem; line-height: 1.7; color: #d4d4d4; margin-bottom: 12px; }
    </style>
</head>
<body>
    <main class="container">
        <div class="checkmark">✓</div>
        <h1>Bon de dépôt envoyé</h1>
        <p>Merci, votre bon de dépôt a bien été transmis à RESET LAB.</p>
        <p>Vous pouvez maintenant déposer votre appareil en atelier. Aucune réparation ne sera engagée sans votre accord préalable sur le devis.</p>
    </main>
</body>
</html>
